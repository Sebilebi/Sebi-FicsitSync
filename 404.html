<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FICSIT Inc. // 404 No Encontrado</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #0f172a;
      --border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-orange: #ea580c;
      --accent-yellow: #f59e0b;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f1f5f9;
        --card-bg: #ffffff;
        --border: #cbd5e1;
        --text-main: #0f172a;
        --text-muted: #475569;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .hazard-stripe {
      height: 8px;
      width: 100%;
      background: repeating-linear-gradient(
        -45deg,
        #ea580c,
        #ea580c 12px,
        #0f172a 12px,
        #0f172a 24px
      );
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .error-card {
      background-color: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .error-body {
      padding: 24px 22px;
      text-align: center;
    }

    .badge-ficsit {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(234, 88, 12, 0.15);
      border: 1px solid var(--accent-orange);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 900;
      color: var(--accent-orange);
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    .icon-container {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px auto;
      background: rgba(234, 88, 12, 0.12);
      border: 2px solid var(--accent-orange);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    .error-title {
      font-size: 22px;
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .error-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--accent-orange);
      color: #ffffff;
      border: none;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background-color: #c2410c;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="hazard-stripe"></div>
    <div class="error-body">
      <div class="badge-ficsit">
        <span>🔍</span> FICSIT // ERROR 404
      </div>

      <div class="icon-container">
        📦
      </div>

      <h1 class="error-title">Recurso FICSIT No Encontrado</h1>
      <p class="error-desc">
        La ruta o instalación a la que intentas acceder no existe en este sector del mapa o ha sido desmantelada.
      </p>

      <a href="/" class="btn">
        <span>🏠</span> Volver al Plano Maestro
      </a>
    </div>
  </div>
</body>
</html>
